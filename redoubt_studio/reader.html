<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Re:doubt Reader</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090e17;color:#f1f5fa;font:19px/1.65 system-ui,Arial,sans-serif}main{max-width:920px;margin:0 auto;padding:36px 46px 90px}h1{font-size:2.15em;line-height:1.2;margin:.3em 0}h2,h3{line-height:1.3}p,li{margin:0 0 1.1em}a{color:#93c5fd}img,video{max-width:100%;height:auto}figure{margin:24px 0}figcaption,.meta{color:#a5b4ca;font-size:.8em}.source{font-size:.8em;color:#b6c7e2}.source a{word-break:break-all}.status{padding:22px;border:1px solid #35455f;border-radius:12px;background:#152035}.reader-content blockquote{border-left:3px solid #689bf5;padding-left:20px;margin-left:0}.reader-content iframe{max-width:100%}.reader-content table{display:block;overflow:auto}#tools{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;gap:8px;background:#111b2ce8;padding:8px 16px}button{background:#293c58;border:1px solid #455c7b;color:white;padding:7px 14px;border-radius:7px;cursor:pointer}button:hover{background:#37527a}@media(max-width:700px){main{padding:20px 18px}body{font-size:17px}}@media print{#tools{display:none}body{background:white;color:black}}
</style></head><body><div id="tools"><button id="smaller" title="Smaller text">A−</button><button id="larger" title="Larger text">A+</button></div><main id="content"><div class="status">Loading article…</div></main><script>
const content=document.getElementById('content'),url=new URLSearchParams(location.search).get('url');let size=19;document.getElementById('larger').onclick=()=>{size=Math.min(34,size+2);document.body.style.fontSize=size+'px'};document.getElementById('smaller').onclick=()=>{size=Math.max(14,size-2);document.body.style.fontSize=size+'px'};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function run(){let valid;try{valid=new URL(url);if(!['https:','http:'].includes(valid.protocol))throw Error()}catch{content.innerHTML='<div class="status">Invalid article URL.</div>';return}const link=`<p class="source"><a href="${esc(valid.href)}" target="_blank" rel="noopener noreferrer">Open original article ↗</a></p>`;try{const r=await fetch('/.netlify/functions/article-reader?url='+encodeURIComponent(valid.href),{headers:{Accept:'application/json'}});const data=await r.json();if(!r.ok)throw Error(data.error||'Article not available');content.innerHTML=`<div class="source">${esc(data.siteName||valid.hostname)}</div><h1>${esc(data.title||'Article')}</h1><div class="meta">${esc([data.byline,data.published].filter(Boolean).join(' · '))}</div>${link}<div class="reader-content">${data.content}</div>${link}`;}catch(e){content.innerHTML=`<div class="status"><h2>Reader Mode unavailable</h2><p>${esc(e.message||'This publisher does not allow article extraction.')}</p><p>Some publishers restrict automated access or require a subscription. You can still open the original article in Brave.</p>${link}</div>`}}run();
</script></body></html>
